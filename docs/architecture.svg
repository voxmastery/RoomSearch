<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#111827">RoomSearch architecture</text>
  <text x="600" y="78" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-size="14" fill="#6b7280">Theme 2 · Multiplayer AI &amp; collaborative agents · Moss in the retrieval layer</text>

  <!-- UI -->
  <rect x="140" y="110" width="920" height="130" rx="16" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
  <text x="600" y="145" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#9A3412">RoomSearch UI (browser)</text>
  <text x="600" y="175" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-size="14" fill="#7C2D12">Shared search · Moss latency pill · source cards · Agent A / Agent B switch · FluctlightDB episode rail</text>
  <text x="600" y="205" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-size="13" fill="#9A3412">One screen. Every search must show live Moss · X.X ms</text>

  <!-- API -->
  <rect x="280" y="290" width="640" height="110" rx="16" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="600" y="330" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#1E40AF">FastAPI on Render</text>
  <text x="600" y="360" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-size="14" fill="#1E3A8A">/api/search · /api/handoff · /api/health</text>
  <text x="600" y="385" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-size="13" fill="#1E40AF">Orchestrates retrieval + memory; does not replace Moss</text>

  <!-- Moss -->
  <rect x="80" y="470" width="480" height="150" rx="16" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <text x="320" y="510" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#065F46">Moss — hot-path retrieval</text>
  <text x="320" y="545" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-size="14" fill="#064E3B">Shared notes index · client.query()</text>
  <text x="320" y="575" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-size="14" fill="#064E3B">Sub-10ms semantic search (no traditional vector DB)</text>
  <text x="320" y="600" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-size="13" fill="#047857">Wall-clock around query → UI latency pill</text>

  <!-- Fluctlight -->
  <rect x="640" y="470" width="480" height="150" rx="16" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="880" y="510" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#5B21B6">FluctlightDB — durable memory</text>
  <text x="880" y="545" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-size="14" fill="#4C1D95">experience() after each search</text>
  <text x="880" y="575" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-size="14" fill="#4C1D95">activate() on Agent A → B handoff</text>
  <text x="880" y="600" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-size="13" fill="#6D28D9">Not a vector DB · does not replace Moss</text>

  <!-- arrows UI to API -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
  <line x1="600" y1="240" x2="600" y2="288" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="620" y="270" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12" fill="#374151">search / handoff</text>

  <!-- API to Moss -->
  <line x1="420" y1="400" x2="320" y2="468" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="430" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12" fill="#059669">client.query</text>

  <!-- API to Fluctlight -->
  <line x1="780" y1="400" x2="880" y2="468" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="790" y="430" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12" fill="#7C3AED">experience / activate</text>

  <!-- Moss back to UI -->
  <path d="M140 470 C 60 350, 60 200, 140 175" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="40" y="320" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12" fill="#059669">sources + Moss ms</text>

  <!-- Fluctlight back to UI -->
  <path d="M1060 470 C 1140 350, 1140 200, 1060 175" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="1075" y="320" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12" fill="#7C3AED">episodes / activated</text>

  <text x="600" y="680" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-size="13" fill="#4B5563">Moss = retrieval every turn. FluctlightDB = episodes + multi-agent handoff. Demo must show the Moss latency pill.</text>
  <text x="600" y="702" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-size="12" fill="#9CA3AF">github.com/voxmastery/RoomSearch · roomsearch-3foy.onrender.com</text>
</svg>
